# TagSLAM config for the ov_plane "Table" dataset (checkerboard as virtual tags).
#
# The static "board" body is the checkerboard, pinned at the world origin. The
# board frame: origin at inner corner (0,0), x along columns, y along rows, z out
# of the board. The four virtual tags match checkerboard_to_apriltag.py
# (6x6 inner corners, square_size 0.088, sub_squares 2 -> tag size 0.176).
#
# The non-static "rig" body carries the D455 and is driven by OpenVINS odometry
# so its pose stays continuous while the board is out of view (intermittent
# visibility). The tags then pull it back to an absolute, drift-free frame.

tagslam_parameters:
  optimizer_mode: slow
  minimum_viewing_angle: 15.0
  minimum_tag_area: 200          # virtual tags are small; tune to your resolution
  max_num_incremental_opt: 50
  pixel_noise: 1.0
  max_subgraph_error: 50.0
  subgraph_abs_prior_position_noise: 0.1
  subgraph_abs_prior_rotation_noise: 0.1
  use_approximate_sync: true     # detections and odometry are not hardware-synced

body_defaults:
  position_noise: 0.05
  rotation_noise: 0.01

default_body: board

bodies:
  - board:
      is_static: true
      default_tag_size: 0.176
      pose:
        position: {x: 0.0, y: 0.0, z: 0.0}
        rotation: {x: 0.0, y: 0.0, z: 0.0}
        position_noise: {x: 0.0001, y: 0.0001, z: 0.0001}
        rotation_noise: {x: 1.0e-05, y: 1.0e-05, z: 1.0e-05}
      type: simple
      tags:
        - id: 0
          size: 0.176
          pose:
            position: {x: 0.088, y: 0.088, z: 0.0}
            rotation: {x: 0.0, y: 0.0, z: 0.0}
            position_noise: {x: 0.0001, y: 0.0001, z: 0.0001}
            rotation_noise: {x: 1.0e-05, y: 1.0e-05, z: 1.0e-05}
        - id: 1
          size: 0.176
          pose:
            position: {x: 0.352, y: 0.088, z: 0.0}
            rotation: {x: 0.0, y: 0.0, z: 0.0}
            position_noise: {x: 0.0001, y: 0.0001, z: 0.0001}
            rotation_noise: {x: 1.0e-05, y: 1.0e-05, z: 1.0e-05}
        - id: 2
          size: 0.176
          pose:
            position: {x: 0.088, y: 0.352, z: 0.0}
            rotation: {x: 0.0, y: 0.0, z: 0.0}
            position_noise: {x: 0.0001, y: 0.0001, z: 0.0001}
            rotation_noise: {x: 1.0e-05, y: 1.0e-05, z: 1.0e-05}
        - id: 3
          size: 0.176
          pose:
            position: {x: 0.352, y: 0.352, z: 0.0}
            rotation: {x: 0.0, y: 0.0, z: 0.0}
            position_noise: {x: 0.0001, y: 0.0001, z: 0.0001}
            rotation_noise: {x: 1.0e-05, y: 1.0e-05, z: 1.0e-05}
  - rig:
      is_static: false
      type: simple
      # OpenVINS odometry drives the rig through gaps in board visibility.
      odom_topic: /ov_msckf/odomimu        # TODO confirm your OpenVINS odom topic
      odom_frame_id: imu                    # matches odom child_frame_id (tum_to_odom_bag --child-frame imu)
      odom_translation_noise: 0.05
      odom_rotation_noise: 0.01
      # T_body_odom: transform from rig body frame to the odom message's body
      # frame (identity if the rig body == the frame OpenVINS reports, i.e. IMU).
